# SEA THE ANSWER — run everything from the repository root.
#
#   docker compose up --build -d                       # app (production builds) → http://localhost:5173
#   docker compose run --rm migrate new <name>          # new migration file in migrations/
#   docker compose -f compose.yaml -f compose.dev.yaml up --build   # development (hot reload)
#   docker compose --profile e2e up --build --exit-code-from e2e e2e  # end-to-end tests, isolated DB
#
# Settings come from the root .env (copy .env.example). See README.md.
name: haedap

x-database-env: &database-env
  POSTGRES_DB: ${POSTGRES_DB:-haedap}
  POSTGRES_USER: ${POSTGRES_USER:-haedap}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-haedap-local}

x-db: &db
  image: postgres:18-alpine
  environment: *database-env
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
    interval: 2s
    timeout: 3s
    retries: 30

# DB migrations (migrations/, dbmate — ADR 0010). Runs once and exits; backend waits for it.
x-migrate: &migrate
  image: amacneil/dbmate:2.36.0
  environment: &migrate-env
    DBMATE_MIGRATIONS_DIR: /db/migrations
    DBMATE_NO_DUMP_SCHEMA: "true"
    DBMATE_WAIT: "true"
  volumes:
    - ./migrations:/db/migrations
  command: ["up"]
  restart: "no"

x-backend-env: &backend-env
  # Optional: grounded model responses (server-side only).
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-}
  # Optional: mounts /api/maritime-data/* (ADR 0008). Empty = disabled.
  MARITIME_DATA_API_TOKEN: ${MARITIME_DATA_API_TOKEN:-}
  MARITIME_DATA_DATABASE_URL: ${MARITIME_DATA_DATABASE_URL:-}

services:
  db:
    <<: *db
    volumes:
      - db-data:/var/lib/postgresql
    restart: unless-stopped

  # Applies pending migrations on every `up`, then exits.
  # New migration: docker compose run --rm migrate new <name>   (see README)
  migrate:
    <<: *migrate
    environment:
      <<: *migrate-env
      DATABASE_URL: postgres://${POSTGRES_USER:-haedap}:${POSTGRES_PASSWORD:-haedap-local}@db:5432/${POSTGRES_DB:-haedap}?sslmode=disable
    depends_on:
      db: { condition: service_healthy }

  backend:
    build: { context: ./backend, target: prod }
    environment:
      <<: *backend-env
      DATABASE_URL: postgresql://${POSTGRES_USER:-haedap}:${POSTGRES_PASSWORD:-haedap-local}@db:5432/${POSTGRES_DB:-haedap}
      # Extra public hostnames/IPs users open (LAN, server domain). localhost is always allowed.
      HAEDAP_ALLOWED_HOSTS: ${HAEDAP_ALLOWED_HOSTS:-}
    volumes:
      - backups:/data/backups
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped
    # Not published: only reachable through the frontend's /api proxy.

  frontend:
    build: { context: ./frontend, target: prod }
    environment:
      HAEDAP_API_ORIGIN: http://backend:8000
    ports:
      # HAEDAP_BIND=0.0.0.0 to accept LAN/server traffic.
      - "${HAEDAP_BIND:-127.0.0.1}:${PORT:-5173}:5173"
    depends_on:
      backend: { condition: service_healthy }
    restart: unless-stopped

  # ---- End-to-end tests (profile "e2e") -------------------------------------------
  # A separate stack with an in-memory database, so tests never touch app data and
  # every run starts empty. Nothing is published to the host.
  e2e-db:
    <<: *db
    profiles: [e2e]
    tmpfs: [/var/lib/postgresql]

  e2e-migrate:
    <<: *migrate
    profiles: [e2e]
    environment:
      <<: *migrate-env
      DATABASE_URL: postgres://${POSTGRES_USER:-haedap}:${POSTGRES_PASSWORD:-haedap-local}@e2e-db:5432/${POSTGRES_DB:-haedap}?sslmode=disable
    depends_on:
      e2e-db: { condition: service_healthy }

  e2e-backend:
    build: { context: ./backend, target: prod }
    profiles: [e2e]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-haedap}:${POSTGRES_PASSWORD:-haedap-local}@e2e-db:5432/${POSTGRES_DB:-haedap}
      HAEDAP_ALLOWED_HOSTS: e2e-frontend
      OPENAI_API_KEY: ""
      OPENAI_MODEL: ""
    tmpfs: ["/data/backups:uid=10001,gid=10001"]
    depends_on:
      e2e-migrate: { condition: service_completed_successfully }

  e2e-frontend:
    build: { context: ./frontend, target: prod }
    profiles: [e2e]
    environment:
      HAEDAP_API_ORIGIN: http://e2e-backend:8000
    depends_on:
      e2e-backend: { condition: service_healthy }

  e2e:
    build: ./e2e
    profiles: [e2e]
    environment:
      E2E_BASE_URL: http://e2e-frontend:5173
      CI: "1"
    volumes:
      # Screenshots, traces and the HTML report land in e2e/ on the host.
      - ./e2e/test-results:/e2e/test-results
      - ./e2e/playwright-report:/e2e/playwright-report
    depends_on:
      e2e-frontend: { condition: service_healthy }

volumes:
  db-data:
  backups:
