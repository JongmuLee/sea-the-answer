name: Verify application

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # Test fixtures create and drop random databases on this disposable service.
      HAEDAP_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.13"
      - run: uv sync --locked --group data
      - run: uv run --no-sync pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate production, development and e2e Compose
        run: |
          docker compose config -q
          docker compose -f compose.yaml -f compose.dev.yaml config -q
          docker compose -p haedap-ci --profile e2e config -q
      - name: Browser workflow against isolated PostgreSQL
        run: docker compose -p haedap-ci --profile e2e up --build --force-recreate --exit-code-from e2e e2e
      - name: Stop test services
        if: always()
        run: docker compose -p haedap-ci --profile e2e down
